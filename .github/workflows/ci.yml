name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    name: Release build and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PG_DSN: postgresql://urlshortener:urlshortener_dev@127.0.0.1:5432/urlshortener
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            catch2 \
            cmake \
            libboost-url-dev \
            libhiredis-dev \
            libpq-dev \
            libredis++-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config \
            postgresql-client

      - name: Apply database schema
        run: psql "$PG_DSN" -f migrations/001_init.sql

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DURLSHORT_BUILD_TESTS=ON \
            -DURLSHORT_ENABLE_INTEGRATION_TESTS=ON \
            -DURLSHORT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: ASan/UBSan tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PG_DSN: postgresql://urlshortener:urlshortener_dev@127.0.0.1:5432/urlshortener
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            catch2 \
            cmake \
            libboost-url-dev \
            libhiredis-dev \
            libpq-dev \
            libredis++-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config \
            postgresql-client

      - name: Apply database schema
        run: psql "$PG_DSN" -f migrations/001_init.sql

      - name: Configure
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DURLSHORT_BUILD_TESTS=ON \
            -DURLSHORT_ENABLE_INTEGRATION_TESTS=ON \
            -DURLSHORT_ENABLE_SANITIZERS=ON \
            -DURLSHORT_SANITIZER=address,undefined \
            -DURLSHORT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-sanitize --parallel "$(nproc)"

      - name: Tests
        run: ctest --test-dir build-sanitize --output-on-failure

  thread-sanitizer:
    name: TSan concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: urlshortener
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener -d urlshortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PG_DSN: postgresql://urlshortener:urlshortener_dev@127.0.0.1:5432/urlshortener
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            catch2 \
            cmake \
            libboost-url-dev \
            libhiredis-dev \
            libpq-dev \
            libredis++-dev \
            libssl-dev \
            nlohmann-json3-dev \
            pkg-config \
            postgresql-client

      - name: Apply database schema
        run: psql "$PG_DSN" -f migrations/001_init.sql

      - name: Configure
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DURLSHORT_BUILD_TESTS=ON \
            -DURLSHORT_ENABLE_INTEGRATION_TESTS=ON \
            -DURLSHORT_ENABLE_SANITIZERS=ON \
            -DURLSHORT_SANITIZER=thread \
            -DURLSHORT_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build-tsan --parallel "$(nproc)"

      - name: Unit and concurrency tests
        run: ctest --test-dir build-tsan --output-on-failure -R "unit|concurrency"
